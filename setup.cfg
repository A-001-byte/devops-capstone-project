[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1
cover-min-percentage=95

[coverage:report]
show_missing = True

[flake8]
max-line-length = 127
exclude = .git,__pycache__,.venv,venv
per-file-ignores =
    service/__init__.py:E402,F401

[pylint.MASTER]
ignore = tests

[pylint.FORMAT]
max-line-length = 127

[pylint.MESSAGES CONTROL]
# E1101 (no-member) is a false positive on SQLAlchemy model attributes such as db.Column
disable = R0903,E1101
