[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1
cover-min-percentage=95

[coverage:report]
show_missing = True

[flake8]
max-line-length = 127
exclude = .git,__pycache__,.venv,venv

[pylint.MASTER]
ignore = tests

[pylint.FORMAT]
max-line-length = 127

[pylint.MESSAGES CONTROL]
disable = R0903
