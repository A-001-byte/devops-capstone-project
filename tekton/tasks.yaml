apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning workspace $(workspaces.source.path)"
        rm -rf $(workspaces.source.path)/* $(workspaces.source.path)/.[!.]* 2>/dev/null || true
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  params:
    - name: database_uri
      description: Database used by the unit tests
      type: string
      default: "sqlite:///tekton-test.db"
    - name: args
      description: Extra arguments for nosetests
      type: string
      default: "-v"
  steps:
    - name: nosetests
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: $(params.database_uri)
      script: |
        #!/bin/bash
        set -e
        python -m pip install --quiet -r requirements.txt
        nosetests $(params.args)
